name: Upload release assets

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/upload-release-assets.yml"
      - "releases/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: version
        run: |
          VERSION="$(sed -n 's/  "version": "\([^"]*\)",/\1/p' package.json | head -1)"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/  "version": "\([^"]*\)",/\1/p' package.json | head -1)"
          NOTES_FILE="releases/RELEASE_NOTES_${VERSION}.md"
          if ! gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            if [[ -f "$NOTES_FILE" ]]; then
              gh release create "${{ steps.version.outputs.tag }}" \
                --title "Sieve ${{ steps.version.outputs.tag }} CRAM-MD5" \
                --notes-file "$NOTES_FILE"
            else
              gh release create "${{ steps.version.outputs.tag }}" \
                --title "Sieve ${{ steps.version.outputs.tag }} CRAM-MD5" \
                --notes "Fork build with CRAM-MD5 support."
            fi
          fi

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/  "version": "\([^"]*\)",/\1/p' package.json | head -1)"
          ASSETS=("releases/sieve-${VERSION}-cram-md5.xpi")
          INSTALLER="releases/install_sieve_${VERSION}.exe"

          if [[ -f "$INSTALLER" ]]; then
            ASSETS+=("$INSTALLER")
          fi

          gh release upload "${{ steps.version.outputs.tag }}" \
            "${ASSETS[@]}" \
            --clobber
