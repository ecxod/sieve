<div class="sieve-global-settings">
  <div class="card mt-4 mb-4">
    <div class="card-body">
      <h4 data-i18n="account.settings" class="card-title"></h4>
      <h5 data-i18n="settings.theme.title" class="mt-3"></h5>
      <p data-i18n="settings.theme.description" class="card-text"></p>
      <label data-i18n="settings.theme.label" for="sieve-theme" class="form-label"></label>
      <select id="sieve-theme" class="form-select form-select-sm">
        <option data-i18n="settings.theme.system" value="system"></option>
        <option data-i18n="settings.theme.light" value="light"></option>
        <option data-i18n="settings.theme.dark" value="dark"></option>
      </select>
    </div>
  </div>

  <div class="card mt-4 mb-4">
    <div class="card-body">
      <h5 data-i18n="settings.sentry.title" class="card-title"></h5>
      <p data-i18n="settings.sentry.description" class="card-text"></p>
      <label data-i18n="settings.sentry.label" for="sieve-sentry-dsn" class="form-label"></label>
      <input data-i18n="settings.sentry.placeholder" id="sieve-sentry-dsn" type="text"
        class="form-control form-control-sm" autocomplete="off" spellcheck="false">
      <div class="mt-3 d-flex align-items-center gap-3">
        <button data-i18n="settings.sentry.save" id="sieve-sentry-save" type="button"
          class="btn btn-sm btn-primary"></button>
        <span id="sieve-sentry-status" class="small" role="status"></span>
      </div>
    </div>
  </div>
</div>
