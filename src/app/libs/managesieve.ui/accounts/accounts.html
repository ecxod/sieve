<div>
  <div class="siv-accounts-items"></div>

  <div class="card mt-4 mb-4">
    <div class="card-body">
      <h4 data-i18n="account.settings" class="card-title"></h4>
      <h5 data-i18n="settings.theme.title" class="mt-3"></h5>
      <p data-i18n="settings.theme.description" class="card-text"></p>
      <label data-i18n="settings.theme.label" for="sieve-theme" class="form-label"></label>
      <select id="sieve-theme" class="form-select form-select-sm">
        <option data-i18n="settings.theme.system" value="system"></option>
        <option data-i18n="settings.theme.light" value="light"></option>
        <option data-i18n="settings.theme.dark" value="dark"></option>
      </select>
    </div>
  </div>

  <div class="card mt-4 mb-4">
    <div class="card-body">
      <h4 data-i18n="accounts.create.title" class="card-title"></h4>
      <p data-i18n="accounts.create.description" class="card-text"></p>
      <button data-i18n="accounts.create.add" class="btn btn-sm btn-outline-primary" id="sieve-account-create"></button>
      <button data-i18n="accounts.create.import.thunderbird" class="btn btn-sm btn-outline-primary" id="sieve-account-import-thunderbird"></button>
      <button data-i18n="accounts.create.import.file" class="btn btn-sm btn-outline-primary" id="sieve-account-import-file"></button>
    </div>
  </div>
</div>
