<div class="sieve-spam-content tab-pane fade p-3" role="tabpanel">
  <div class="d-flex flex-wrap align-items-center gap-2 mb-3 sieve-spam-toolbar">
    <label class="visually-hidden sieve-spam-search-label" for="sieve-spam-search">Spam durchsuchen</label>
    <input type="search" class="form-control form-control-sm sieve-spam-search"
      placeholder="Absender, Empfänger oder Betreff suchen" autocomplete="off">
    <button type="button" class="btn btn-sm btn-outline-secondary sieve-spam-refresh">Aktualisieren</button>
    <button type="button" class="btn btn-sm btn-primary sieve-spam-clean" disabled>Spam entfernen</button>
    <button type="button" class="btn btn-sm btn-success sieve-spam-allow" disabled>Absender dauerhaft erlauben</button>
  </div>

  <div class="alert alert-secondary py-2 sieve-spam-status" role="status" aria-live="polite"></div>

  <div class="table-responsive sieve-spam-table-wrap">
    <table class="table table-hover align-middle sieve-spam-table">
      <thead>
        <tr>
          <th scope="col" class="sieve-spam-select-column">
            <input type="checkbox" class="form-check-input sieve-spam-select-visible"
              aria-label="Alle sichtbaren Nachrichten auswählen">
          </th>
          <th scope="col">Datum</th>
          <th scope="col">Absender</th>
          <th scope="col">Betreff</th>
        </tr>
      </thead>
      <tbody class="sieve-spam-rows"></tbody>
    </table>
  </div>

  <div class="dropdown-menu sieve-spam-context-menu">
    <button type="button" class="dropdown-item sieve-spam-context-show"></button>
    <button type="button" class="dropdown-item sieve-spam-context-rule"></button>
    <button type="button" class="dropdown-item sieve-spam-context-search"></button>
  </div>

  <div class="modal fade sieve-spam-headers-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title sieve-spam-headers-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <pre class="sieve-spam-headers mb-0"></pre>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade sieve-spam-rule-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title sieve-spam-rule-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted sieve-spam-rule-description"></p>
          <div class="row g-3">
            <div class="col-lg-5">
              <h6 class="sieve-spam-rule-criteria-title"></h6>
              <div class="sieve-spam-rule-criteria"></div>

              <label class="form-label mt-3 sieve-spam-rule-action-label"></label>
              <select class="form-select sieve-spam-rule-action">
                <option value="fileinto"></option>
                <option value="keep"></option>
                <option value="discard"></option>
              </select>

              <div class="mt-3 sieve-spam-rule-mailbox-group">
                <label class="form-label sieve-spam-rule-mailbox-label"></label>
                <input type="text" class="form-control sieve-spam-rule-mailbox">
              </div>

              <label class="form-label mt-3 sieve-spam-rule-script-label"></label>
              <select class="form-select sieve-spam-rule-script"></select>
              <div class="form-text sieve-spam-rule-connection"></div>
            </div>
            <div class="col-lg-7">
              <h6 class="sieve-spam-rule-preview-title"></h6>
              <pre class="sieve-spam-rule-preview"></pre>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary sieve-spam-rule-copy"></button>
          <button type="button" class="btn btn-primary sieve-spam-rule-save"></button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="settings.cancel"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade sieve-spam-matches-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title sieve-spam-matches-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-info sieve-spam-matches-status"></div>
          <div class="list-group sieve-spam-matches-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>
